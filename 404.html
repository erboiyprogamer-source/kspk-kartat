<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karttaa ei löytynyt | K-S-P-K</title>
<meta name="description" content="Tätä karttaa ei löytynyt.">
<meta name="theme-color" content="#060a08">
<meta name="color-scheme" content="dark">
<link rel="icon" href="https://erboiyprogamer-source.github.io/kspk-kotisivut/assets/img/favicon.svg" type="image/svg+xml">
<!-- Tyylit ovat tahan sivuun upotettuna eika sivuston tyylitiedostosta,
     jotta virhesivu nayttaa oikealta myos silloin kun sivusto on alhaalla
     tai sen osoite on muuttunut. Virhesivu ei saa itse olla riippuvainen
     mistaan mika voi olla rikki. -->
<style>
  :root{ --bg:#060a08; --ink:#e8f5ee; --dim:#8fa89b; --green:#3ef08a; --line:#1b2a22 }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  body{ display:grid; place-content:center; text-align:center; padding:32px 20px; gap:4px }
  .code{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--green); margin-bottom:14px }
  h1{ font-size:clamp(28px,6vw,44px); line-height:1.15; margin:0 0 14px;
    background:linear-gradient(100deg,var(--green),#9ef0c4); -webkit-background-clip:text;
    background-clip:text; color:transparent }
  p{ margin:0 auto 10px; max-width:46ch; color:var(--dim); line-height:1.6 }
  .maps{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:24px }
  a.btn{ display:inline-block; padding:12px 18px; min-height:44px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink); text-decoration:none; font-weight:500;
    background:#0b1410; transition:border-color .2s, transform .2s }
  a.btn:hover{ border-color:var(--green); transform:translateY(-1px) }
  a.btn--solid{ background:var(--green); color:#05130c; border-color:transparent; font-weight:600 }
  .note{ margin-top:26px; font-size:13px; color:#5f7468 }
</style>
</head>
<body>

<div class="code">Virhe 404</div>
<h1>Tätä karttaa ei löytynyt</h1>
<p>
  Osoite ei vastaa mitään kolmesta kartasta. Kartta on ehkä nimetty uudelleen,
  tai linkki on vanha.
</p>

<div class="maps">
  <a class="btn btn--solid" href="https://erboiyprogamer-source.github.io/kspk-kotisivut/kartta.html">Karttasivulle</a>
  <a class="btn" href="/kspk-kartat/paiva/">Päiväkartta</a>
  <a class="btn" href="/kspk-kartat/yo/">Yökartta</a>
  <a class="btn" href="/kspk-kartat/5k/">Suuri kartta</a>
</div>

<p class="note">K-S-P-K Minecraft SMP — karttojen julkaisu</p>

</body>
</html>
